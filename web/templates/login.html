<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Åtkomst — GBS &amp; IgA-brist Kunskapsdatabas</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .login-container {
      max-width: 420px;
      margin: 8rem auto;
      padding: 0 1.5rem;
    }
    .login-card {
      background: var(--surface);
      border-radius: 8px;
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      text-align: center;
    }
    .login-card h1 {
      font-size: 1.2rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .login-card p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }
    .login-card input[type="text"] {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 0.15em;
      font-family: 'SF Mono', 'Fira Code', monospace;
      margin-bottom: 1rem;
    }
    .login-card input:focus {
      outline: none;
      border-color: var(--accent-light);
      box-shadow: 0 0 0 2px rgba(41,128,185,0.15);
    }
    .login-card .btn {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
    }
    .login-error {
      color: #c0392b;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>

<div class="topbar">
  <h1>GBS &amp; IgA-brist &mdash; Kunskapsdatabas</h1>
</div>

<div class="login-container">
  <div class="login-card">
    <h1>Åtkomstkod krävs</h1>
    <p>Denna kunskapsdatabas är avsedd för sjukvårdspersonal. Ange den kod du fått för att få tillgång.</p>

    {% if error %}
    <p class="login-error">{{ error }}</p>
    {% endif %}

    <form method="POST">
      <input type="text" name="code" placeholder="Ange kod" autofocus autocomplete="off">
      <button type="submit" class="btn">Öppna</button>
    </form>
  </div>
</div>

<footer class="disclaimer">
  <div class="disclaimer-inner">
    <p><strong>Medicinsk disclaimer</strong> — Innehållet är avsett som beslutsstöd för legitimerad sjukvårdspersonal.</p>
  </div>
</footer>

</body>
</html>
